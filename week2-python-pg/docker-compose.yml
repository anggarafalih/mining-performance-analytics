version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mining_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-pama_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PamaSecure2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pama_admin} -d ${POSTGRES_DB:-mining_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
